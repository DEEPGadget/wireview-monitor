[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wvd"
version = "0.1.0"
description = "WireView Pro II measurement daemon: REST/WebSocket API, web dashboard and CLI"
requires-python = ">=3.10"
license = { text = "MIT" }
# The client (wvd.client) and CLI (wvctl) need only the standard library;
# the daemon needs the [server] extra.
dependencies = []

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
test = ["wvd[server]", "pytest>=8", "httpx>=0.27"]

[project.scripts]
wvd = "wvd.daemon:main"
wvctl = "wvd.cli:entry"

[project.entry-points.pytest11]
wvd = "wvd.testing"

[tool.setuptools]
packages = ["wvd"]

[tool.setuptools.package-data]
wvd = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
